<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Dados de Planilha</title>
    <!-- Biblioteca SheetJS para leitura de arquivos Excel no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h2 { font-size: 18px; margin-top: 0; color: #1a365d; text-align: center; }
        
        .upload-section {
            background: #edf2f7;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 2px dashed #cbd5e0;
            text-align: center;
        }
        input[type="file"] { display: none; }
        .custom-file-upload {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #2b6cb0;
            color: white;
            border-radius: 4px;
            font-weight: bold;
            font-size: 15px;
            box-sizing: border-box;
            text-align: center;
            cursor: pointer;
        }
        .custom-file-upload:hover { background-color: #2c5282; }

        .file-name {
            margin-top: 8px;
            font-size: 12px;
            color: #4a5568;
            word-break: break-all;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            max-height: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            padding: 10px;
            text-align: left;
            font-size: 12px;
            border-bottom: 1px solid #cbd5e0;
            border-right: 1px solid #cbd5e0;
        }
        th {
            background-color: #2b6cb0;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:nth-child(even) { background-color: #f7fafc; }

        .btn-back {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #4a5568;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            box-sizing: border-box;
            margin-top: 20px;
        }
        .btn-back:hover { background-color: #2d3748; }
    </style>
</head>
<body>

<div class="container">
    <h2>Extrator de Dados de Planilha (Excel)</h2>
    
    <div class="upload-section">
        <label for="arquivoExcel" class="custom-file-upload">
            📊 Escolher Planilha Excel (.xlsx, .xls)
        </label>
        <input type="file" id="arquivoExcel" accept=".xlsx, .xls, .csv" onchange="lerExcel(event)">
        <div id="nomeArquivo" class="file-name">Nenhum arquivo selecionado</div>
    </div>

    <div id="relatorio-conteudo">
        <h3 style="font-size: 15px; margin-bottom: 5px; color: #2d3748;">Dados Extraídos da Planilha</h3>
        <div class="table-responsive">
            <table id="tabelaDados">
                <thead id="cabecalhoTabela">
                    <tr>
                        <th>Aguardando upload...</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <tr><td>Selecione um arquivo Excel para visualizar os dados formatados.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <a href="index.html" class="btn-back">⬅️ Voltar para o Menu Principal</a>
</div>

<script>
    function lerExcel(e) {
        const arquivo = e.target.files[0];
        if (!arquivo) return;

        document.getElementById('nomeArquivo').innerText = "Arquivo: " + arquivo.name;

        const leitor = new FileReader();
        leitor.onload = function(e) {
            try {
                const dadosBinarios = new Uint8Array(e.target.result);
                const workbook = XLSX.read(dadosBinarios, { type: 'array' });

                // Pega a primeira aba da planilha
                const primeiraAbaNome = workbook.SheetNames[0];
                const aba = workbook.Sheets[primeiraAbaNome];

                // Converte a aba em uma matriz de linhas/colunas
                const dadosJson = XLSX.utils.sheet_to_json(aba, { header: 1 });

                renderizarTabela(dadosJson);
            } catch (erro) {
                console.error("Erro ao ler Excel:", erro);
                alert("Erro ao processar o arquivo Excel. Verifique se o formato é válido.");
            }
        };
        leitor.readAsArrayBuffer(arquivo);
    }

    function renderizarTabela(linhas) {
        const thead = document.getElementById('cabecalhoTabela');
        const tbody = document.getElementById('corpoTabela');

        thead.innerHTML = '';
        tbody.innerHTML = '';

        if (!linhas || linhas.length === 0) {
            tbody.innerHTML = `<tr><td>A planilha está vazia.</td></tr>`;
            return;
        }

        // Primeira linha como cabeçalho
        let cabecalhoHtml = '<tr>';
        linhas[0].forEach(coluna => {
            cabecalhoHtml += `<th>${coluna !== undefined ? coluna : ''}</th>`;
        });
        cabecalhoHtml += '</tr>';
        thead.innerHTML = cabecalhoHtml;

        // Demais linhas como dados
        for (let i = 1; i < linhas.length; i++) {
            let tr = document.createElement('tr');
            let linhaVazia = true;

            let linhaHtml = '';
            linhas[i].forEach(celula => {
                let valor = celula !== undefined ? celula : '';
                if (valor !== '') linhaVazia = false;
                linhaHtml += `<td>${valor}</td>`;
            });

            // Só adiciona a linha se ela não estiver totalmente em branco
            if (!linhaVazia) {
                tr.innerHTML = linhaHtml;
                tbody.appendChild(tr);
            }
        }
    }
</script>

</body>
</html>
