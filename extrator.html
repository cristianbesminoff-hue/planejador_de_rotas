<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator e Filtro de Planilha</title>
    <!-- Biblioteca SheetJS para leitura de Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h2 { font-size: 18px; margin-top: 0; color: #1a365d; text-align: center; }
        
        .form-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .control-group {
            margin-bottom: 12px;
        }
        .control-group:last-child { margin-bottom: 0; }
        
        label { font-size: 13px; font-weight: bold; color: #2d3748; display: block; margin-bottom: 4px; }
        
        input, select {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #fff;
        }

        .upload-section {
            background: #edf2f7;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            border: 2px dashed #cbd5e0;
            text-align: center;
        }
        input[type="file"] { display: none; }
        .custom-file-upload {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #2b6cb0;
            color: white;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .custom-file-upload:hover { background-color: #2c5282; }

        .file-name {
            margin-top: 6px;
            font-size: 12px;
            color: #4a5568;
            word-break: break-all;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            max-height: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            padding: 9px 10px;
            text-align: left;
            font-size: 12px;
            border-bottom: 1px solid #cbd5e0;
            border-right: 1px solid #cbd5e0;
        }
        th {
            background-color: #2b6cb0;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:nth-child(even) { background-color: #f7fafc; }

        .btn-action {
            background-color: #319795;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            padding: 12px;
            margin-top: 15px;
            border-radius: 4px;
            width: 100%;
            font-size: 14px;
        }
        .btn-action:hover { background-color: #2c7a7b; }

        .btn-back {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #4a5568;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            box-sizing: border-box;
            margin-top: 15px;
        }
        .btn-back:hover { background-color: #2d3748; }
    </style>
</head>
<body>

<div class="container">
    <h2>Extrator e Filtro de Planilha</h2>
    
    <div class="form-section">
        <div class="control-group">
            <label for="cidadeFiltro">Filtrar por Cidade (Opcional):</label>
            <input list="cidadesRS" id="cidadeFiltro" placeholder="Ex: Canoas (Deixe em branco para todas)...">
            <datalist id="cidadesRS">
                <option value="Canoas">
                <option value="Porto Alegre">
                <option value="Cachoeirinha">
                <option value="Nova Santa Rita">
                <option value="Esteio">
                <option value="Sapucaia do Sul">
                <option value="São Leopoldo">
                <option value="Novo Hamburgo">
                <option value="Alvorada">
                <option value="Gravataí">
                <option value="Viamão">
            </datalist>
        </div>

        <div class="control-group" style="margin-top: 12px;">
            <label>Carregar Planilha do Relatório:</label>
            <div class="upload-section">
                <label for="arquivoExcel" class="custom-file-upload">
                    📊 Escolher Arquivo Excel (.xlsx, .xls, .csv)
                </label>
                <input type="file" id="arquivoExcel" accept=".xlsx, .xls, .csv" onchange="carregarArquivo(event)">
                <div id="nomeArquivo" class="file-name">Nenhum arquivo selecionado</div>
            </div>
        </div>

        <button class="btn-action" onclick="processarFiltro()" id="btnProcessar" disabled>⚙️ Filtrar e Organizar Dados</button>
    </div>

    <div id="relatorio-conteudo">
        <h3 style="font-size: 14px; margin-bottom: 5px; color: #2d3748;">Dados Filtrados (<span id="contadorLinhas">0</span> registros)</h3>
        <div class="table-responsive">
            <table id="tabelaDados">
                <thead id="cabecalhoTabela">
                    <tr><th>Aguardando planilha...</th></tr>
                </thead>
                <tbody id="corpoTabela">
                    <tr><td>Selecione um arquivo e clique em filtrar.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <a href="index.html" class="btn-back">⬅️ Voltar para o Menu Principal</a>
</div>

<script>
    let dadosBrutos = [];
    let cabecalhosGlobais = [];

    function carregarArquivo(e) {
        const arquivo = e.target.files[0];
        if (!arquivo) return;

        document.getElementById('nomeArquivo').innerText = "Arquivo: " + arquivo.name;

        const leitor = new FileReader();
        leitor.onload = function(e) {
            try {
                const dadosBinarios = new Uint8Array(e.target.result);
                const workbook = XLSX.read(dadosBinarios, { type: 'array' });
                const primeiraAba = workbook.SheetNames[0];
                const aba = workbook.Sheets[primeiraAba];

                const json = XLSX.utils.sheet_to_json(aba, { header: 1 });
                if (json.length > 0) {
                    cabecalhosGlobais = json[0];
                    dadosBrutos = json.slice(1);
                    document.getElementById('btnProcessar').disabled = false;
                    alert("Planilha carregada com sucesso! Clique em 'Filtrar e Organizar Dados'.");
                }
            } catch (erro) {
                console.error(erro);
                alert("Erro ao ler o arquivo.");
            }
        };
        leitor.readAsArrayBuffer(arquivo);
    }

    function processarFiltro() {
        if (dadosBrutos.length === 0) return;

        const cidadeBusca = document.getElementById('cidadeFiltro').value.trim().toLowerCase();
        
        // Filtra as linhas com base na cidade digitada (se preenchida)
        let dadosFiltrados = dadosBrutos.filter(linha => {
            if (!cidadeBusca) return true;
            // Varre as colunas da linha procurando pelo texto da cidade
            return linha.some(celula => celula && celula.toString().toLowerCase().includes(cidadeBusca));
        });

        renderizarTabela(cabecalhosGlobais, dadosFiltrados);
    }

    function renderizarTabela(cabecalhos, linhas) {
        const thead = document.getElementById('cabecalhoTabela');
        const tbody = document.getElementById('corpoTabela');
        const contador = document.getElementById('contadorLinhas');

        thead.innerHTML = '';
        tbody.innerHTML = '';
        contador.innerText = linhas.length;

        if (linhas.length === 0) {
            tbody.innerHTML = `<tr><td>Nenhum registro encontrado para este filtro.</td></tr>`;
            return;
        }

        // Monta cabeçalho
        let trHead = '<tr>';
        cabecalhos.forEach(col => {
            trHead += `<th>${col !== undefined ? col : ''}</th>`;
        });
        trHead += '</tr>';
        thead.innerHTML = trHead;

        // Monta linhas
        linhas.forEach(linha => {
            let tr = document.createElement('tr');
            let linhaHtml = '';
            let vazia = true;

            cabecalhos.forEach((_, index) => {
                let valor = linha[index] !== undefined ? linha[index] : '';
                if (valor !== '') vazia = false;
                linhaHtml += `<td>${valor}</td>`;
            });

            if (!vazia) {
                tr.innerHTML = linhaHtml;
                tbody.appendChild(tr);
            }
        });
    }
</script>

</body>
</html>
