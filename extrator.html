<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator e Seletor de Colunas</title>
    <!-- Biblioteca SheetJS para leitura de Excel no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h2 { font-size: 18px; margin-top: 0; color: #1a365d; text-align: center; }
        
        .form-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .control-group {
            margin-bottom: 12px;
        }
        
        label { font-size: 13px; font-weight: bold; color: #2d3748; display: block; margin-bottom: 4px; }
        
        input, select {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #fff;
        }

        .upload-section {
            background: #edf2f7;
            padding: 12px;
            border-radius: 6px;
            margin-top: 5px;
            border: 2px dashed #cbd5e0;
            text-align: center;
        }
        input[type="file"] { display: none; }
        .custom-file-upload {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #2b6cb0;
            color: white;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .custom-file-upload:hover { background-color: #2c5282; }

        .file-name {
            margin-top: 6px;
            font-size: 12px;
            color: #4a5568;
            word-break: break-all;
        }

        .checkbox-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
            background: #fff;
            border: 1px solid #cbd5e0;
            padding: 10px;
            border-radius: 4px;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 5px;
        }
        .checkbox-item {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .checkbox-item input {
            width: auto;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            max-height: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* Força a tabela a respeitar os limites */
        }
        th, td {
            padding: 8px 10px;
            text-align: left;
            font-size: 11px;
            border-bottom: 1px solid #cbd5e0;
            border-right: 1px solid #cbd5e0;
            word-wrap: break-word; /* Quebra palavras longas para não vazar */
            overflow-wrap: break-word;
            white-space: normal; /* Permite quebra de linha interna */
        }
        th {
            background-color: #2b6cb0;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:nth-child(even) { background-color: #f7fafc; }

        .btn-action {
            background-color: #319795;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            padding: 12px;
            margin-top: 15px;
            border-radius: 4px;
            width: 100%;
            font-size: 14px;
        }
        .btn-action:hover { background-color: #2c7a7b; }

        .btn-print {
            background-color: #d97706;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            width: 100%;
            font-size: 14px;
            display: none;
        }
        .btn-print:hover { background-color: #b45309; }

        .btn-back {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #4a5568;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            box-sizing: border-box;
            margin-top: 15px;
        }
        .btn-back:hover { background-color: #2d3748; }

        /* Configuração estrita para Impressão e PDF (Modo Paisagem) */
        @media print {
            @page {
                size: landscape;
                margin: 10mm;
            }
            body { background-color: #fff; padding: 0; font-size: 10px; }
            .container { box-shadow: none; padding: 0; max-width: 100%; width: 100%; }
            .form-section, .btn-action, .btn-print, .btn-back { display: none !important; }
            .table-responsive { max-height: none; border: none; overflow: visible; }
            table { width: 100%; table-layout: fixed; }
            th, td { padding: 6px; font-size: 10px; border: 1px solid #000; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Extrator e Seletor de Colunas</h2>
    
    <div class="form-section">
        <div class="control-group">
            <label>1. Carregar Planilha Excel:</label>
            <div class="upload-section">
                <label for="arquivoExcel" class="custom-file-upload">
                    📊 Escolher Arquivo (.xlsx, .xls, .csv)
                </label>
                <input type="file" id="arquivoExcel" accept=".xlsx, .xls, .csv" onchange="carregarArquivo(event)">
                <div id="nomeArquivo" class="file-name">Nenhum arquivo selecionado</div>
            </div>
        </div>

        <div class="control-group" style="margin-top: 12px;">
            <label for="cidadeFiltro">2. Filtrar por Cidade (Opcional):</label>
            <input list="cidadesRS" id="cidadeFiltro" placeholder="Ex: Canoas (Deixe em branco para todas)...">
            <datalist id="cidadesRS">
                <option value="Canoas">
                <option value="Porto Alegre">
                <option value="Cachoeirinha">
                <option value="Nova Santa Rita">
                <option value="Esteio">
                <option value="Sapucaia do Sul">
                <option value="São Leopoldo">
                <option value="Novo Hamburgo">
                <option value="Alvorada">
                <option value="Gravataí">
                <option value="Viamão">
            </datalist>
        </div>

        <div class="control-group" style="margin-top: 12px;">
            <label>3. Selecione quais colunas deseja extrair:</label>
            <div id="seletorColunas" class="checkbox-container">
                <span style="font-size: 12px; color: #718096; padding: 5px;">Carregue uma planilha primeiro...</span>
            </div>
        </div>

        <button class="btn-action" onclick="processarExtracao()" id="btnProcessar" disabled>⚙️ Extrair e Gerar Lista</button>
    </div>

    <div id="relatorio-conteudo">
        <h3 style="font-size: 14px; margin-bottom: 5px; color: #2d3748;">Resultado Extraído (<span id="contadorLinhas">0</span> registros)</h3>
        <div class="table-responsive">
            <table id="tabelaDados">
                <thead id="cabecalhoTabela">
                    <tr><th>Aguardando processamento...</th></tr>
                </thead>
                <tbody id="corpoTabela">
                    <tr><td>Sua lista aparecerá aqui.</td></tr>
                </tbody>
            </table>
        </div>
        <button class="btn-print" id="btnImprimir" onclick="window.print()">🖨️ Imprimir / Salvar em PDF</button>
    </div>

    <a href="index.html" class="btn-back">⬅️ Voltar para o Menu Principal</a>
</div>

<script>
    let dadosBrutos = [];
    let cabecalhosGlobais = [];

    function carregarArquivo(e) {
        const arquivo = e.target.files[0];
        if (!arquivo) return;

        document.getElementById('nomeArquivo').innerText = "Arquivo: " + arquivo.name;

        const leitor = new FileReader();
        leitor.onload = function(e) {
            try {
                const dadosBinarios = new Uint8Array(e.target.result);
                const workbook = XLSX.read(dadosBinarios, { type: 'array' });
                const primeiraAba = workbook.SheetNames[0];
                const aba = workbook.Sheets[primeiraAba];

                const json = XLSX.utils.sheet_to_json(aba, { header: 1 });
                if (json.length > 0) {
                    cabecalhosGlobais = json[0];
                    dadosBrutos = json.slice(1);
                    gerarCheckboxesColunas(cabecalhosGlobais);
                    document.getElementById('btnProcessar').disabled = false;
                }
            } catch (erro) {
                console.error(erro);
                alert("Erro ao ler o arquivo Excel.");
            }
        };
        leitor.readAsArrayBuffer(arquivo);
    }

    function gerarCheckboxesColunas(cabecalhos) {
        const container = document.getElementById('seletorColunas');
        container.innerHTML = '';

        cabecalhos.forEach((col, index) => {
            if (col !== undefined && col !== null && col !== '') {
                let div = document.createElement('div');
                div.className = 'checkbox-item';
                div.innerHTML = `
                    <input type="checkbox" id="col_${index}" value="${index}" checked>
                    <label for="col_${index}" style="display:inline; font-weight:normal; cursor:pointer;">${col}</label>
                `;
                container.appendChild(div);
            }
        });
    }

    function processarExtracao() {
        if (dadosBrutos.length === 0) return;

        const checkboxes = document.querySelectorAll('#seletorColunas input[type="checkbox"]:checked');
        let indicesSelecionados = Array.from(checkboxes).map(cb => parseInt(cb.value));

        if (indicesSelecionados.length === 0) {
            alert("Selecione pelo menos uma coluna para extrair.");
            return;
        }

        const cidadeBusca = document.getElementById('cidadeFiltro').value.trim().toLowerCase();

        let dadosFiltrados = dadosBrutos.filter(linha => {
            if (!cidadeBusca) return true;
            return linha.some(celula => celula && celula.toString().toLowerCase().includes(cidadeBusca));
        });

        renderizarTabelaCustomizada(indicesSelecionados, dadosFiltrados);
    }

    function renderizarTabelaCustomizada(indices, linhas) {
        const thead = document.getElementById('cabecalhoTabela');
        const tbody = document.getElementById('corpoTabela');
        const contador = document.getElementById('contadorLinhas');
        const btnImprimir = document.getElementById('btnImprimir');

        thead.innerHTML = '';
        tbody.innerHTML = '';
        contador.innerText = linhas.length;

        if (linhas.length === 0) {
            tbody.innerHTML = `<tr><td>Nenhum registro encontrado para este filtro.</td></tr>`;
            btnImprimir.style.display = 'none';
            return;
        }

        let trHead = '<tr>';
        indices.forEach(idx => {
            let nomeColuna = cabecalhosGlobais[idx] || `Coluna ${idx}`;
            trHead += `<th>${nomeColuna}</th>`;
        });
        trHead += '</tr>';
        thead.innerHTML = trHead;

        linhas.forEach(linha => {
            let tr = document.createElement('tr');
            let linhaHtml = '';
            let vazia = true;

            indices.forEach(idx => {
                let valor = linha[idx] !== undefined ? linha[idx] : '';
                if (valor !== '') vazia = false;
                linhaHtml += `<td>${valor}</td>`;
            });

            if (!vazia) {
                tr.innerHTML = linhaHtml;
                tbody.appendChild(tr);
            }
        });

        btnImprimir.style.display = 'block';
    }
</script>

</body>
</html>
