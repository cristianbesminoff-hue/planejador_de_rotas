<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejador de Rotas - RS</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h2 { font-size: 18px; margin-top: 0; color: #1a365d; text-align: center; }
        
        .form-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .control-group {
            margin-bottom: 12px;
        }
        
        label { font-size: 13px; font-weight: bold; color: #2d3748; display: block; margin-bottom: 4px; }
        
        input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #fff;
        }

        .btn-add {
            background-color: #2b6cb0;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            padding: 10px;
            margin-top: 8px;
            border-radius: 4px;
            width: 100%;
            font-size: 14px;
        }
        .btn-add:hover { background-color: #2c5282; }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            max-height: 300px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px 10px;
            text-align: left;
            font-size: 12px;
            border-bottom: 1px solid #cbd5e0;
        }
        th {
            background-color: #2b6cb0;
            color: white;
            position: sticky;
            top: 0;
        }
        tr:nth-child(even) { background-color: #f7fafc; }

        .btn-delete {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-delete:hover { background-color: #c53030; }

        .btn-action {
            background-color: #319795;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            padding: 12px;
            margin-top: 15px;
            border-radius: 4px;
            width: 100%;
            font-size: 14px;
        }
        .btn-action:hover { background-color: #2c7a7b; }

        .btn-back {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #4a5568;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            box-sizing: border-box;
            margin-top: 15px;
        }
        .btn-back:hover { background-color: #2d3748; }
    </style>
</head>
<body>

<div class="container">
    <h2>Planejador de Rotas - Rio Grande do Sul</h2>
    
    <div class="form-section">
        <div class="control-group">
            <label for="cidadeSelect">1. Selecione a Cidade no RS (497 municípios):</label>
            <input list="listaCidadesRS" id="cidadeSelect" placeholder="Digite ou selecione a cidade...">
            <datalist id="listaCidadesRS">
                <option value="Carregando cidades do RS...">
            </datalist>
        </div>

        <div class="control-group">
            <label for="enderecoInput">2. Endereço / Rua e Número:</label>
            <input type="text" id="enderecoInput" placeholder="Ex: Av. Getúlio Vargas, 1200">
        </div>

        <button class="btn-add" onclick="adicionarParada()">➕ Adicionar à Rota</button>
    </div>

    <div>
        <h3 style="font-size: 14px; margin-bottom: 5px; color: #2d3748;">Paradas na Rota (<span id="contadorParadas">0</span>)</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 35%;">Cidade</th>
                        <th style="width: 50%;">Endereço</th>
                        <th style="width: 15%; text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoTabelaRotas">
                    <tr><td colspan="3" style="text-align: center; color: #718096;">Nenhuma parada adicionada ainda.</td></tr>
                </tbody>
            </table>
        </div>
        <button class="btn-action" id="btnGerarRota" onclick="gerarRotaMaps()" style="display: none;">🗺️ Abrir Rota Completa no Google Maps</button>
    </div>

    <a href="index.html" class="btn-back">⬅️ Voltar para o Menu Principal</a>
</div>

<script>
    let paradas = [];

    // Carrega automaticamente todas as 497 cidades do RS via API oficial do IBGE ao abrir a página
    window.onload = function() {
        fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados/43/municipios')
            .then(response => response.json())
            .then(municipios => {
                const datalist = document.getElementById('listaCidadesRS');
                datalist.innerHTML = ''; // Limpa o aviso de carregamento
                municipios.sort((a, b) => a.nome.localeCompare(b.nome)); // Organiza em ordem alfabética
                municipios.forEach(mun => {
                    let option = document.createElement('option');
                    option.value = mun.nome;
                    datalist.appendChild(option);
                });
            })
            .catch(error => {
                console.error('Erro ao carregar municípios do IBGE:', error);
                document.getElementById('listaCidadesRS').innerHTML = '<option value="Erro ao carregar cidades. Digite manualmente.">';
            });
    };

    function adicionarParada() {
        const cidade = document.getElementById('cidadeSelect').value.trim();
        const endereco = document.getElementById('enderecoInput').value.trim();

        if (!cidade || !endereco) {
            alert("Por favor, preencha tanto a cidade quanto o endereço.");
            return;
        }

        paradas.push({ cidade, endereco });
        
        // Limpa apenas o endereço para facilitar a próxima digitação rápida da mesma cidade
        document.getElementById('enderecoInput').value = '';
        document.getElementById('enderecoInput').focus();

        atualizarTabelaRotas();
    }

    function removerParada(index) {
        paradas.splice(index, 1);
        atualizarTabelaRotas();
    }

    function atualizarTabelaRotas() {
        const tbody = document.getElementById('corpoTabelaRotas');
        const contador = document.getElementById('contadorParadas');
        const btnGerar = document.getElementById('btnGerarRota');

        tbody.innerHTML = '';
        contador.innerText = paradas.length;

        if (paradas.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #718096;">Nenhuma parada adicionada ainda.</td></tr>`;
            btnGerar.style.display = 'none';
            return;
        }

        paradas.forEach((parada, index) => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${parada.cidade}</strong></td>
                <td>${parada.endereco}</td>
                <td style="text-align: center;"><button class="btn-delete" onclick="removerParada(${index})">Excluir</button></td>
            `;
            tbody.appendChild(tr);
        });

        btnGerar.style.display = 'block';
    }

    function gerarRotaMaps() {
        if (paradas.length === 0) return;

        // Formata os pontos de parada para a API de rotas diretas do Google Maps
        let origem = encodeURIComponent(paradas[0].endereco + ", " + paradas[0].cidade + " - RS");
        let destino = encodeURIComponent(paradas[paradas.length - 1].endereco + ", " + paradas[paradas.length - 1].cidade + " - RS");
        
        let waypointsStr = "";
        if (paradas.length > 2) {
            let intermediarias = paradas.slice(1, paradas.length - 1);
            let arrayWp = intermediarias.map(p => encodeURIComponent(p.endereco + ", " + p.cidade + " - RS"));
            waypointsStr = "&waypoints=" + arrayWp.join("|");
        }

        const urlMaps = `https://www.google.com/maps/dir/?api=1&origin=${origem}&destination=${destino}${waypointsStr}&travelmode=driving`;
        window.open(urlMaps, '_blank');
    }
</script>

</body>
</html>
