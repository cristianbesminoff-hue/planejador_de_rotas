<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Rotas via PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h2 { font-size: 18px; margin-top: 0; color: #1a365d; text-align: center; }
        
        .upload-section {
            background: #edf2f7;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 2px dashed #cbd5e0;
            text-align: center;
        }
        input[type="file"] { display: none; }
        .custom-file-upload {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #2b6cb0;
            color: white;
            border-radius: 4px;
            font-weight: bold;
            font-size: 15px;
            box-sizing: border-box;
            text-align: center;
            cursor: pointer;
        }
        
        .controls-panel {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .control-group {
            margin-bottom: 12px;
        }
        .control-group:last-child { margin-bottom: 0; }
        
        label { font-size: 13px; font-weight: bold; color: #2d3748; display: block; margin-bottom: 4px; }
        
        button, input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #fff;
        }
        
        button.btn-maps {
            background-color: #d97706;
            color: white;
            border: none;
            font-weight: bold;
            margin-top: 5px;
            cursor: pointer;
        }
        button.btn-maps:hover { background-color: #b45309; }
        
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            padding: 10px;
            text-align: left;
            font-size: 12px;
            border-bottom: 1px solid #cbd5e0;
            border-right: 1px solid #cbd5e0;
        }
        th {
            background-color: #2b6cb0;
            color: white;
        }
        tr:nth-child(even) { background-color: #f7fafc; }
        
        .file-name {
            margin-top: 8px;
            font-size: 12px;
            color: #4a5568;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Planejador de Rotas via PDF</h2>
    
    <div class="upload-section">
        <label for="arquivoPdf" class="custom-file-upload">
            📂 Escolher Relatório Operacional (.pdf)
        </label>
        <input type="file" id="arquivoPdf" accept=".pdf" onchange="lerPDF(event)">
        <div id="nomeArquivo" class="file-name">Nenhum arquivo selecionado</div>
    </div>

    <div class="controls-panel">
        <div class="control-group">
            <label for="pontoPartida">Ponto de Partida (Opcional - Ex: Base Canoas):</label>
            <input type="text" id="pontoPartida" placeholder="Ex: Rua Exemplo, Canoas - RS">
        </div>

        <div class="control-group" style="margin-top: 15px;">
            <button class="btn-maps" onclick="abrirGoogleMaps()" id="btnMaps" disabled>🗺️ Abrir Rota Completa no Google Maps</button>
        </div>
    </div>

    <div id="relatorio-conteudo">
        <h3 style="font-size: 15px; margin-bottom: 5px; color: #2d3748;">Endereços Identificados para a Rota</h3>
        <div class="table-responsive">
            <table id="tabelaDados">
                <thead>
                    <tr>
                        <th>Endereço Formatado</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <tr><td>Aguardando upload do relatório em PDF...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let enderecosExtraidos = [];

    async function lerPDF(e) {
        const arquivo = e.target.files[0];
        if (!arquivo) return;

        document.getElementById('nomeArquivo').innerText = "Arquivo: " + arquivo.name;

        const leitor = new FileReader();
        leitor.onload = async function(e) {
            try {
                const typedarray = new Uint8Array(e.target.result);
                const pdf = await pdfjsLib.getDocument({ data: typedarray }).promise;
                
                let itensTexto = [];

                for (let i = 1; i <= pdf.numPages; i++) {
                    const pagina = await pdf.getPage(i);
                    const conteudoTextual = await pagina.getTextContent();
                    
                    // Organiza o texto por linhas verticais (coordenada Y)
                    let linhasPagina = {};
                    conteudoTextual.items.forEach(item => {
                        let y = Math.round(item.transform[5] / 4) * 4;
                        if (!linhasPagina[y]) linhasPagina[y] = [];
                        linhasPagina[y].push({ x: item.transform[4], text: item.str.trim() });
                    });

                    let coordsY = Object.keys(linhasPagina).sort((a, b) => b - a);
                    coordsY.forEach(y => {
                        let linhaItens = linhasPagina[y].sort((a, b) => a.x - b.x);
                        let textoCompletoLinha = linhaItens.map(i => i.text).join(" ");
                        itensTexto.push(textoCompletoLinha);
                    });
                }

                enderecosExtraidos = processarEnderecosRelatorio(itensTexto);
                renderizarTabela(enderecosExtraidos);

                if (enderecosExtraidos.length > 0) {
                    document.getElementById('btnMaps').disabled = false;
                } else {
                    alert("Não foram encontrados endereços válidos neste PDF. Verifique se é o relatório operacional padrão.");
                }
            } catch (erro) {
                console.error(erro);
                alert("Erro ao processar o arquivo PDF.");
            }
        };
        leitor.readAsArrayBuffer(arquivo);
    }

    function processarEnderecosRelatorio(linhas) {
        let enderecosValidos = [];

        linhas.forEach(linha => {
            let linhaLower = linha.toLowerCase();
            // Ignora cabeçalhos e rodapés comuns do relatório
            if (linhaLower.includes('relatório operacional') || linhaLower.includes('data:') || linhaLower.includes('empresa') || linhaLower.includes('técnico')) {
                return;
            }

            // Procura por padrões que contenham termos de logradouro ou vírgulas estruturadas com números
            if (linhaLower.includes('rua') || linhaLower.includes('av') || linhaLower.includes('travessa') || linhaLower.includes('nossa') || linha.includes(',')) {
                // Remove excessos de espaços
                let limpo = linha.replace(/\s+/g, ' ').trim();
                
                // Se a linha contiver a cidade associada ou padrão de endereço com número e CEP
                if (limpo.length > 8 && !enderecosValidos.includes(limpo)) {
                    enderecosValidos.push(limpo);
                }
            }
        });

        return enderecosValidos;
    }

    function renderizarTabela(dados) {
        const tbody = document.getElementById('corpoTabela');
        tbody.innerHTML = '';

        if (dados.length === 0) {
            tbody.innerHTML = `<tr><td>Nenhum endereço encontrado.</td></tr>`;
            return;
        }

        dados.forEach(texto => {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td>${texto}</td>`;
            tbody.appendChild(tr);
        });
    }

    function abrirGoogleMaps() {
        const pontoPartida = document.getElementById('pontoPartida').value.trim();

        if (enderecosExtraidos.length === 0) {
            alert("Nenhum endereço disponível para gerar a rota.");
            return;
        }

        let pontosParaRota = [];

        if (pontoPartida) {
            pontosParaRota.push(encodeURIComponent(pontoPartida));
        }

        enderecosExtraidos.forEach(end => {
            // Garante que o formato enviado para o Maps inclua Canoas-RS caso o PDF não traga explícito na linha
            let enderecoFormatado = end;
            if (!enderecoFormatado.toLowerCase().includes('canoas')) {
                enderecoFormatado += ", Canoas - RS";
            }
            pontosParaRota.push(encodeURIComponent(enderecoFormatado));
        });

        if (pontosParaRota.length > 25) {
            alert("O Google Maps aceita no máximo 25 paradas por vez. O sistema abrirá os primeiros 25 pontos do relatório.");
            pontosParaRota = pontosParaRota.slice(0, 25);
        }

        let urlMaps = `https://www.google.com/maps/dir/${pontosParaRota.join('/')}`;
        window.open(urlMaps, '_blank');
    }
</script>

</body>
</html>
