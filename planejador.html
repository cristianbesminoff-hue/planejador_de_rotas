<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejador de Rotas Inteligente</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h2 { font-size: 18px; margin-top: 0; color: #1a365d; text-align: center; }
        
        .form-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .control-group {
            margin-bottom: 12px;
        }
        .control-group:last-child { margin-bottom: 0; }
        
        label { font-size: 13px; font-weight: bold; color: #2d3748; display: block; margin-bottom: 4px; }
        
        input, select {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #fff;
        }
        
        .btn-add {
            background-color: #2b6cb0;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            padding: 10px;
            margin-top: 5px;
            border-radius: 4px;
            width: 100%;
        }
        .btn-add:hover { background-color: #2c5282; }

        .btn-maps {
            background-color: #d97706;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            padding: 12px;
            margin-top: 15px;
            border-radius: 4px;
            width: 100%;
            font-size: 15px;
        }
        .btn-maps:hover { background-color: #b45309; }
        .btn-maps:disabled { background-color: #cbd5e0; cursor: not-allowed; }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px 10px;
            text-align: left;
            font-size: 12px;
            border-bottom: 1px solid #cbd5e0;
        }
        th {
            background-color: #2b6cb0;
            color: white;
        }
        tr:nth-child(even) { background-color: #f7fafc; }
        
        .btn-del {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-del:hover { background-color: #c53030; }
    </style>
</head>
<body>

<div class="container">
    <h2>Planejador de Rotas</h2>
    
    <div class="form-section">
        <div class="control-group">
            <label for="cidadeSelect">Cidade:</label>
            <input list="cidadesRS" id="cidadeSelect" placeholder="Digite para buscar a cidade (Ex: Canoas)..." value="Canoas - RS">
            <datalist id="cidadesRS">
                <option value="Canoas - RS">
                <option value="Porto Alegre - RS">
                <option value="Cachoeirinha - RS">
                <option value="Nova Santa Rita - RS">
                <option value="Esteio - RS">
                <option value="Sapucaia do Sul - RS">
                <option value="São Leopoldo - RS">
                <option value="Novo Hamburgo - RS">
                <option value="Alvorada - RS">
                <option value="Gravataí - RS">
                <option value="Viamão - RS">
                <option value="Três Coroas - RS">
                <option value="Gramado - RS">
                <option value="Canela - RS">
                <option value="Caxias do Sul - RS">
                <option value="Pelotas - RS">
                <option value="Santa Maria - RS">
            </datalist>
        </div>

        <div class="control-group" style="margin-top: 10px;">
            <label for="pontoPartida">Ponto de Partida (Opcional - Ex: Base / Rua):</label>
            <input type="text" id="pontoPartida" placeholder="Ex: Rua Exemplo, 100">
        </div>

        <div class="control-group" style="margin-top: 10px;">
            <label for="enderecoInput">Endereço de Atendimento (Rua e Número/CEP):</label>
            <input type="text" id="enderecoInput" placeholder="Ex: Rua Jaguarão, 106 ou 92330-330" onkeypress="checarEnter(event)">
        </div>

        <button class="btn-add" onclick="adicionarEndereco()">➕ Adicionar à Rota</button>
    </div>

    <div class="controls-panel">
        <h3 style="font-size: 14px; color: #2d3748; margin-bottom: 5px;">Paradas Adicionadas (<span id="contadorParadas">0</span>)</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Endereço / Destino</th>
                        <th style="width: 60px; text-align: center;">Ação</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <tr><td colspan="2" style="text-align: center; color: #718096;">Nenhum endereço adicionado ainda.</td></tr>
                </tbody>
            </table>
        </div>

        <button class="btn-maps" onclick="abrirGoogleMaps()" id="btnMaps" disabled>🗺️ Abrir Rota Completa no Google Maps</button>
    </div>
</div>

<script>
    let listaEnderecos = [];

    function checarEnter(e) {
        if (e.key === 'Enter') {
            adicionarEndereco();
        }
    }

    function adicionarEndereco() {
        const ruaInput = document.getElementById('enderecoInput');
        const cidadeInput = document.getElementById('cidadeSelect');
        
        let rua = ruaInput.value.trim();
        let cidade = cidadeInput.value.trim();

        if (!rua) {
            alert("Digite o endereço ou CEP.");
            return;
        }

        if (!cidade) {
            cidade = "Canoas - RS";
        }

        let enderecoCompleto = `${rua}, ${cidade}`;
        listaEnderecos.push(enderecoCompleto);

        ruaInput.value = '';
        ruaInput.focus();

        atualizarTabela();
    }

    function removerEndereco(index) {
        listaEnderecos.splice(index, 1);
        atualizarTabela();
    }

    function atualizarTabela() {
        const tbody = document.getElementById('corpoTabela');
        const contador = document.getElementById('contadorParadas');
        const btnMaps = document.getElementById('btnMaps');

        tbody.innerHTML = '';
        contador.innerText = listaEnderecos.length;

        if (listaEnderecos.length === 0) {
            tbody.innerHTML = `<tr><td colspan="2" style="text-align: center; color: #718096;">Nenhum endereço adicionado ainda.</td></tr>`;
            btnMaps.disabled = true;
            return;
        }

        listaEnderecos.forEach((end, index) => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${end}</td>
                <td style="text-align: center;"><button class="btn-del" onclick="removerEndereco(${index})">Excluir</button></td>
            `;
            tbody.appendChild(tr);
        });

        btnMaps.disabled = false;
    }

    function abrirGoogleMaps() {
        const pontoPartida = document.getElementById('pontoPartida').value.trim();
        const cidadePadrao = document.getElementById('cidadeSelect').value.trim();

        if (listaEnderecos.length === 0) {
            alert("Adicione pelo menos um endereço.");
            return;
        }

        let pontosParaRota = [];

        if (pontoPartida) {
            let partidaCompleta = pontoPartida.toLowerCase().includes('rs') ? pontoPartida : `${pontoPartida}, ${cidadePadrao}`;
            pontosParaRota.push(encodeURIComponent(partidaCompleta));
        }

        listaEnderecos.forEach(end => {
            pontosParaRota.push(encodeURIComponent(end));
        });

        if (pontosParaRota.length > 25) {
            alert("O Google Maps aceita no máximo 25 paradas por vez. O sistema abrirá os primeiros 25 pontos.");
            pontosParaRota = pontosParaRota.slice(0, 25);
        }

        let urlMaps = `https://www.google.com/maps/dir/${pontosParaRota.join('/')}`;
        window.open(urlMaps, '_blank');
    }
</script>

</body>
</html>
