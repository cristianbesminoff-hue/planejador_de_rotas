<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Ferramentas - Logística</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            box-sizing: border-box;
        }
        h2 { font-size: 20px; margin-top: 0; color: #1a365d; margin-bottom: 20px; }
        
        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #2b6cb0;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .menu-btn:hover { background-color: #2c5282; }
        .menu-btn.secondary {
            background-color: #d97706;
        }
        .menu-btn.secondary:hover { background-color: #b45309; }
        
        .footer-text {
            margin-top: 15px;
            font-size: 12px;
            color: #718096;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Painel de Logística</h2>
    
    <a href="extrair.html" class="menu-btn">📄 Extrair Dados (PDF)</a>
    <a href="planejador.html" class="menu-btn secondary">🗺️ Planejador de Rotas</a>
    
    <div class="footer-text">Selecione a ferramenta desejada</div>
</div>

</body>
</html>
