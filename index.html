<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roteirizador Inteligente - Menu Principal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            box-sizing: border-box;
            text-align: center;
        }
        h1 { font-size: 20px; color: #1a365d; margin-top: 0; margin-bottom: 8px; }
        p { font-size: 13px; color: #718096; margin-bottom: 25px; }
        
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #2b6cb0;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .menu-btn:hover { background-color: #2c5282; }

        .menu-btn.manual { background-color: #319795; }
        .menu-btn.manual:hover { background-color: #2c7a7b; }

        .menu-btn.help { background-color: #4a5568; }
        .menu-btn.help:hover { background-color: #2d3748; }
    </style>
</head>
<body>

<div class="container">
    <h1>Roteirizador Inteligente</h1>
    <p>Selecione a ferramenta desejada para continuar:</p>

    <div class="menu-list">

        <a href="planejador.html" class="menu-btn manual">🗺️ Roteirizador Manual</a>
        <a href="instrucoes.html" class="menu-btn help">📖 Manual de Instruções</a>
    </div>
</div>

</body>
</html>
